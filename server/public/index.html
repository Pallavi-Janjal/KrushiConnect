<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrushiConnect — Smart Agricultural Equipment Sharing</title>
    <meta name="description" content="Smart Farming Starts with the Right Equipment. Rent. Farm. Earn. Grow." />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <style>
      /* ── HTML-level splash loader (visible before React JS loads) ── */
      #html-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #052e16 0%, #14532d 50%, #166534 100%);
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #html-splash.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 12px;
        animation: bounce 1.2s ease-in-out infinite;
      }
      .splash-title {
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
      }
      .splash-subtitle {
        font-size: 13px;
        color: #86efac;
        font-weight: 500;
        margin-bottom: 36px;
        letter-spacing: 0.3px;
      }
      .splash-bar-wrap {
        width: 200px;
        height: 4px;
        background: rgba(255,255,255,0.15);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .splash-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4ade80, #86efac);
        border-radius: 99px;
        animation: loadBar 2.4s ease-in-out forwards;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ade80;
        animation: dotPulse 1.2s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-8px); }
      }
      @keyframes loadBar {
        0%   { width: 0%; }
        20%  { width: 30%; }
        60%  { width: 70%; }
        90%  { width: 90%; }
        100% { width: 100%; }
      }
      @keyframes dotPulse {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40%           { transform: scale(1);   opacity: 1; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-yJMSVwkN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CDPpKwLt.css">
  </head>
  <body class="bg-[#F7F9FB] text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased">

    <!-- Instant HTML splash — removed by React once app is ready -->
    <div id="html-splash">
      <img src="/logo.png" alt="KrushiConnect Logo" class="splash-logo object-contain bg-white/95 rounded-2xl p-2 shadow-lg" />
      <div class="splash-title">KrushiConnect</div>
      <div class="splash-subtitle">Smart Agricultural Equipment Sharing</div>
      <div class="splash-bar-wrap">
        <div class="splash-bar"></div>
      </div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
  </body>
</html>
