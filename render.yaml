services:
  - type: web
    name: krushiconnect
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
